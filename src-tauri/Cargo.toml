[package]
name = "textmint"
version = "0.6.1"
description = "Textmint - clean & convert AI text, entirely on-device"
authors = ["Charles Kelsoe"]
edition = "2021"
# The app is the default binary; textmint-render (src/bin/) is the CLI's
# markdown renderer, so `cargo run` / `tauri dev` need to be told which to run.
default-run = "textmint"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "textmint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fancy-regex = "0.19.2"
pulldown-cmark = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
# A normal dependency, not dev-only: with the updater configured,
# tauri::generate_context! emits code that references serde_json at the crate
# root. It is also used by the tests.
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
# In-app updates for the macOS build and the Windows NSIS installer. process is
# used to relaunch after an update installs. See docs/plans/self-update.md.
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Opens external URLs in the default browser: the About box's repo and issue
# links, and the MSI download page. Scoped to the repo in capabilities.
tauri-plugin-opener = "2"
# Dev-only MCP bridge, so an AI agent (Claude Code) can click, type, run JS in and
# screenshot the running app. Optional and off by default: a release build and CI
# never compile it. Turn it on for a dev session only, with
#   npm run tauri dev -- --features mcp
# See docs/AUTOMATION.md for what it exposes and why it is gated this hard.
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }
ammonia = "4.2.0"
htmd = "0.5.5"
html5ever = "0.38"
markup5ever_rcdom = "0.38"

[features]
# See tauri-plugin-mcp-bridge above. Registered only in a debug build as well.
mcp = ["dep:tauri-plugin-mcp-bridge"]

