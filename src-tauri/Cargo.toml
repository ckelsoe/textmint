[package]
name = "textmint"
version = "0.3.0"
description = "Textmint - clean & convert AI text, entirely on-device"
authors = ["Charles Kelsoe"]
edition = "2021"
# The app is the default binary; textmint-render (src/bin/) is the CLI's
# markdown renderer, so `cargo run` / `tauri dev` need to be told which to run.
default-run = "textmint"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "textmint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fancy-regex = "0.19.2"
pulldown-cmark = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
serde_json = "1.0.151"

