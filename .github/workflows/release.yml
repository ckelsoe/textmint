name: Release

# Tag-triggered only. Do NOT add pull_request: the Apple Developer ID
# certificate and the Azure OIDC identity are in scope in this workflow, and a
# fork PR that can run with them is a straight exfiltration path for both.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release

jobs:
  verify:
    name: verify
    # Only the public mirror holds the signing secrets and the free macOS
    # minutes. A tag pushed here in textmint-dev must not build anything.
    if: github.repository == 'ckelsoe/textmint'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run the same checks as CI
        run: scripts/check.sh

      - name: Tag must match the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -e "process.stdout.write(require('./package.json').version)")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            echo "a version bump touches package.json, Cargo.toml, tauri.conf.json and the footer span" >&2
            exit 1
          fi
          echo "tag v$TAG matches package.json"

  macos:
    name: macos (aarch64)
    # Only the public mirror holds the signing secrets and the free macOS
    # minutes. A tag pushed here in textmint-dev must not build anything.
    if: github.repository == 'ckelsoe/textmint'
    needs: verify
    runs-on: macos-latest
    env:
      # Signing and notarization happen inside `tauri build` when these are set.
      # Leave them unset to produce an unsigned build for testing.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      # The updater's own minisign key, separate from the Apple cert. With
      # createUpdaterArtifacts on, `tauri build` needs it to sign the .app.tar.gz.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # createUpdaterArtifacts is on, so a build without the updater key fails at
      # bundling, minutes in. Fail fast with the fix instead.
      - name: Updater signing key must be set
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Generate it with 'tauri signer generate' and add TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD to this repo's secrets, and the public key to tauri.conf.json. See docs/plans/self-update.md." >&2
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-cargo-macos-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci

      # Tauri reads APPLE_API_KEY_PATH as a filesystem path, so the key has to
      # exist on disk before the build. Without this the job signs, then fails
      # at notarization 10+ minutes in.
      - name: Materialize the notarization key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -z "$APPLE_API_KEY_B64" ]; then
            echo "::warning::APPLE_API_KEY_B64 unset; build will be signed but NOT notarized"
            exit 0
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_B64" | base64 -d > "$HOME/private_keys/AuthKey.p8"
          chmod 600 "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          args: --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          # The DMG is the first-install download; the .app.tar.gz and its .sig
          # are what the updater pulls. All three go on the release.
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  windows:
    name: windows
    # Only the public mirror holds the signing secrets and the free macOS
    # minutes. A tag pushed here in textmint-dev must not build anything.
    if: github.repository == 'ckelsoe/textmint'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # createUpdaterArtifacts is on, so a build without the updater key fails at
      # bundling. Fail fast with the fix instead.
      - name: Updater signing key must be set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Generate it with 'tauri signer generate' and add TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD to this repo's secrets, and the public key to tauri.conf.json. See docs/plans/self-update.md." >&2
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-cargo-windows-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci

      # "Unsigned" means Authenticode: Azure signs the .exe/.msi in the next step.
      # The updater's minisign key is separate and signs the .sig files here.
      - name: Build (Authenticode-unsigned)
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Signing is a separate step because the installers must exist first.
      - name: Is Azure signing configured?
        id: azure
        shell: bash
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure signing not configured; installers will be unsigned"
          fi

      # Secret names match the 1Password Environment exactly, so the values
      # copy across without translation.
      - name: Sign the installers
        if: steps.azure.outputs.configured == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ENDPOINT }}
          signing-account-name: ${{ secrets.CODESIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.CERTIFICATE_PROFILE_NAME }}
          files-folder: src-tauri/target/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true

      # Azure Authenticode-signs the .exe after `tauri build` already wrote the
      # updater .sig, so the .sig now covers the pre-signing bytes and the updater
      # would reject the download as tampered. Regenerate the signature over the
      # signed installer. Only when Azure actually signed; an unsigned build's
      # original .sig already matches.
      - name: Re-sign the updater signature over the signed installer
        if: steps.azure.outputs.configured == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          exe=$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -1)
          if [ -z "$exe" ]; then
            echo "::error::no NSIS -setup.exe found to re-sign" >&2
            exit 1
          fi
          # --app-version binds the version into the signature's trusted comment,
          # which `tauri build` does automatically; the macOS .sig has it, so the
          # hand re-sign must set it too or the two platforms disagree.
          version=$(node -p "require('./package.json').version")
          npm run tauri -- signer sign --app-version "$version" "$exe"
          echo "re-signed $(basename "$exe").sig (v$version) over the Authenticode-signed installer"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # The NSIS -setup.exe and its .sig feed the updater; the MSI ships for
          # hand or IT install and is not in the manifest.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Linux is parked. See docs/SECURITY.md: a Linux build links glib 0.18.5,
  # which carries GHSA-wrw7-89jp-8q8g, and webkit2gtk 2.0.2 (the newest there
  # is) still requires glib ^0.18. Revisit when webkit2gtk moves to the
  # gtk 0.19 / glib 0.22 stack and Tauri follows.

  virustotal:
    name: virustotal scan
    needs: [macos, windows]
    # Informational only: continue-on-error so a VirusTotal hiccup never blocks a
    # release. The detection ratio per installer lands in the job summary; a
    # brand-new signed binary often shows a few heuristic false positives that
    # clear as it is seen more, so read the report, do not gate on it.
    if: github.repository == 'ckelsoe/textmint'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Scan the installers on VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::warning::VT_API_KEY is unset; skipping the VirusTotal scan"
            exit 0
          fi
          echo "## VirusTotal" >> "$GITHUB_STEP_SUMMARY"
          found=0
          while IFS= read -r f; do
            found=1
            name=$(basename "$f")
            echo "::group::VirusTotal: $name"
            size=$(stat -c%s "$f")
            # Files over 32 MB need a one-time large-file upload URL.
            if [ "$size" -gt 33554432 ]; then
              endpoint=$(curl -sS -H "x-apikey: $VT_API_KEY" \
                https://www.virustotal.com/api/v3/files/upload_url 2>/dev/null | jq -r '.data // empty')
              [ -n "$endpoint" ] || endpoint="https://www.virustotal.com/api/v3/files"
            else
              endpoint="https://www.virustotal.com/api/v3/files"
            fi
            id=$(curl -sS -X POST "$endpoint" -H "x-apikey: $VT_API_KEY" \
              --form file=@"$f" 2>/dev/null | jq -r '.data.id // empty')
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            link="https://www.virustotal.com/gui/file/$sha"
            if [ -z "$id" ]; then
              echo "::warning::$name: upload to VirusTotal failed"
              echo "- \`$name\`: upload failed" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"; continue
            fi
            status=""
            for _ in $(seq 1 30); do
              a=$(curl -sS -H "x-apikey: $VT_API_KEY" \
                "https://www.virustotal.com/api/v3/analyses/$id" 2>/dev/null || echo '{}')
              status=$(echo "$a" | jq -r '.data.attributes.status // empty')
              [ "$status" = "completed" ] && break
              sleep 20
            done
            if [ "$status" != "completed" ]; then
              echo "::warning::$name: analysis did not finish in time"
              echo "- \`$name\`: analysis timed out - [report]($link)" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"; continue
            fi
            mal=$(echo "$a" | jq -r '.data.attributes.stats.malicious // 0')
            susp=$(echo "$a" | jq -r '.data.attributes.stats.suspicious // 0')
            harmless=$(echo "$a" | jq -r '.data.attributes.stats.harmless // 0')
            undet=$(echo "$a" | jq -r '.data.attributes.stats.undetected // 0')
            total=$((mal + susp + harmless + undet))
            echo "$name: $mal/$total malicious, $susp suspicious"
            echo "- \`$name\`: **$mal/$total** malicious, $susp suspicious - [report]($link)" >> "$GITHUB_STEP_SUMMARY"
            [ "$mal" -gt 0 ] && echo "::warning::$name flagged by $mal engine(s); review $link"
            echo "::endgroup::"
          done < <(find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) | sort)
          [ "$found" = "1" ] || echo "::warning::no installers found to scan"

  release:
    name: draft release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'ckelsoe/textmint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # The updater reads latest.json from the release. The signature fields are
      # the contents of the .sig files, and the URLs are where the assets land
      # once the release is published. macOS updates from the .app.tar.gz, Windows
      # from the NSIS -setup.exe; the MSI is deliberately absent.
      - name: Build the updater manifest (latest.json)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          mac_tar=$(find dist -name '*.app.tar.gz' ! -name '*.sig' | head -1)
          mac_sig=$(find dist -name '*.app.tar.gz.sig' | head -1)
          win_exe=$(find dist -name '*-setup.exe' ! -name '*.sig' | head -1)
          win_sig=$(find dist -name '*-setup.exe.sig' | head -1)

          for f in "$mac_tar" "$mac_sig" "$win_exe" "$win_sig"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then
              echo "::error::missing updater artifact (mac_tar=$mac_tar mac_sig=$mac_sig win_exe=$win_exe win_sig=$win_sig)" >&2
              exit 1
            fi
          done

          jq -n \
            --arg version "$VERSION" \
            --arg notes "Textmint $VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg macsig "$(cat "$mac_sig")" \
            --arg macurl "$BASE/$(basename "$mac_tar")" \
            --arg winsig "$(cat "$win_sig")" \
            --arg winurl "$BASE/$(basename "$win_exe")" \
            '{version:$version, notes:$notes, pub_date:$date, platforms:{"darwin-aarch64":{signature:$macsig,url:$macurl},"windows-x86_64":{signature:$winsig,url:$winurl}}}' \
            > latest.json
          echo "latest.json:"; cat latest.json

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "Signed installers for macOS (Apple Silicon) and Windows. The macOS DMG and the Windows -setup.exe self-update through the app; the MSI is a signed download for hand or IT install and is not in the update manifest. Publishing this release (clearing the draft) is what arms the in-app updater for every installed copy, so verify on a clean machine first." \
            latest.json \
            $(find dist -type f | tr '\n' ' ')
